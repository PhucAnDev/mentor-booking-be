name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deploys from corrupting ACA traffic split
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrmenbooking
  CONTAINER_APP_NAME: ca-mentor-booking-backend
  RESOURCE_GROUP: rg-mentor-booking

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build container image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        # DevSecOps: HARD BLOCK on CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push container image to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Canary)
        run: |
          echo "Deploying image ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}"

          # Update with new image + inject connection string from secret
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-name backend \
            --image ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }} \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=secretref:sql-connection-string" \
              "JwtSettings__Secret=secretref:jwt-secret"

          # Get latest and previous active revisions for canary split
          LATEST_REV=$(az containerapp show -n ${{ env.CONTAINER_APP_NAME }} -g ${{ env.RESOURCE_GROUP }} --query "properties.latestRevisionName" -o tsv)
          PREVIOUS_REV=$(az containerapp revision list -n ${{ env.CONTAINER_APP_NAME }} -g ${{ env.RESOURCE_GROUP }} --query "[?properties.active==\`true\` && name!='$LATEST_REV'] | [0].name" -o tsv)

          if [[ -n "$PREVIOUS_REV" && "$PREVIOUS_REV" != "null" && "$PREVIOUS_REV" != "$LATEST_REV" ]]; then
            echo "Canary: 80% -> $PREVIOUS_REV, 20% -> $LATEST_REV"
            az containerapp ingress traffic set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --revision-weight "$PREVIOUS_REV=80" "$LATEST_REV=20"
          else
            echo "First deploy. Routing 100% traffic to $LATEST_REV"
            az containerapp ingress traffic set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --revision-weight "$LATEST_REV=100"
          fi

      - name: Notify Telegram on Success
        if: success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="✅ <b>Backend Deployed!</b> ✅%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Commit:</b> <code>${{ github.sha }}</code>%0A<b>By:</b> ${{ github.actor }}%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Run</a>"

      - name: Notify Telegram on Failure
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="🚨 <b>Backend Deploy FAILED!</b> 🚨%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Commit:</b> <code>${{ github.sha }}</code>%0A<b>By:</b> ${{ github.actor }}%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Run</a>"
